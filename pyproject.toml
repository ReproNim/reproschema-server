[project]
name = "reproschema-deployment"
version = "0.1.0"
description = "Deployment configuration for ReproSchema projects"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "ReproNim Community", email = "info@repronim.org"},
]
dependencies = [
    # Core web framework
    "sanic>=23.6.0",
    "sanic-ext>=23.6.0",
    # Security
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.1",
    "cryptography>=41.0.0",
    # HTTP client with security features
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    # Data validation and parsing
    "pydantic>=2.0.0",
    "jsonschema>=4.17.0",
    # Environment management
    "python-dotenv>=1.0.0",
    # Production server
    "gunicorn>=21.2.0",
    "uvloop>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
]
database = [
    "asyncpg>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
]
monitoring = [
    "prometheus-client>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
